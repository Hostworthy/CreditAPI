# Example: CreditAPI behind Nginx with HTTPS. Optional; the server works on
# its own too. Lines marked "needed" differ from a typical proxy setup.
#
# In CreditAPI's .env:
#   PUBLIC_URL=https://ai.example.com
#   TRUSTED_PROXIES=172.16.0.0/12   # optional, see below
#
# TRUSTED_PROXIES lets CreditAPI see the real client address (for the admin
# sign-in lockout) instead of the proxy's. List the address Nginx connects
# from as seen inside the container: with Docker's published ports that is
# the Docker bridge (172.16.0.0/12 covers the default networks).

server {
    listen 443 ssl;
    server_name ai.example.com;

    ssl_certificate     /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;

    # Needed: the default 1 MB rejects photos. Match MAX_BODY_MB.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Needed: stream answers as they arrive (server-sent events).
        proxy_buffering off;
        # Needed: answers can take minutes. Match REQUEST_TIMEOUT (10m).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
