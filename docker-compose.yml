services:
  claude-api:
    image: ghcr.io/atb00ker/creditapi:latest
    build: .
    container_name: creditapi
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      # Keys, subscriptions, saved logins and CLI state live here.
      - creditapi-data:/data
    # Each request runs one CLI process (roughly 250-350 MB while active).
    mem_limit: 1536m

    # To let apps in other compose projects reach this container by name,
    # join their network:
    # networks: [apps]

volumes:
  creditapi-data:

